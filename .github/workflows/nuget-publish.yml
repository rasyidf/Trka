name: Publish NuGet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --no-restore

      - name: Pack Terka
        run: dotnet pack src/Terka/Terka.csproj -c Release --no-build -o ./nupkgs

      - name: Pack Terka.Span
        run: dotnet pack src/Terka.Span/Terka.Span.csproj -c Release --no-build -o ./nupkgs

      - name: Push to GitHub Packages
        run: dotnet nuget push "./nupkgs/*.nupkg" --api-key ${{ secrets.GITHUB_TOKEN }} --source "https://nuget.pkg.github.com/rasyidf/index.json" --skip-duplicate
